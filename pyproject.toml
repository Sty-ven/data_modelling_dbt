[project]
name = "data-modelling-dbt"
version = "0.1.0"
description = "Ingestion script for new york taxi"
authors = [
    {name = "Sty-ven",email = "oriyomistephen@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=1.5.0",
    "pyarrow>=7.0.0",
    "fastparquet>=0.8.0",
    "requests>=2.28.0",
    "snowflake-connector-python>=3.0.0",
    "dbt-core>=1.4.0",
    "dbt-snowflake>=1.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.9.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
